<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12181F">
<title>Gaplashamiz — Rus tilini noldan o'rganish</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=PT+Sans:wght@400;700&family=PT+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12181F;
    --ink-2:#1B232D;
    --paper:#ECEFF3;
    --paper-2:#FFFFFF;
    --charcoal:#1B1F27;
    --mist:#6B7480;
    --amber:#E0A458;
    --amber-deep:#B9803A;
    --teal:#2F8F82;
    --line: rgba(255,255,255,0.09);
    --line-dark: rgba(18,24,31,0.12);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'PT Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    overscroll-behavior-y:none;
  }
  #app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

  .brandbar{
    padding:28px 20px 18px;
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
    background:var(--ink);
  }
  .brandbar .eyebrow{
    font-family:'PT Mono', monospace;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--amber); margin:0 0 6px;
  }
  .brandbar h1{
    font-family:'PT Serif', serif; font-weight:700;
    font-size:26px; line-height:1.15; margin:0 0 6px; color:#fff;
  }
  .brandbar p{margin:0; color:var(--mist); font-size:13.5px;}

  .level-row{display:flex; gap:8px; margin-top:14px; overflow-x:auto; scrollbar-width:none;}
  .level-row::-webkit-scrollbar{display:none;}
  .level-pill{
    flex:none; font-family:'PT Mono',monospace; font-size:11px; font-weight:700;
    padding:6px 12px; border-radius:999px; border:1px solid var(--line); color:var(--mist);
    background:transparent; white-space:nowrap;
  }
  .level-pill.active{ background:var(--amber); color:#241505; border-color:var(--amber);}

  .detail-header{
    position:sticky; top:0; z-index:30;
    background:var(--ink);
    border-bottom:1px solid var(--line);
    padding:14px 16px 0 16px;
  }
  .detail-toprow{display:flex; align-items:center; gap:10px; padding-bottom:12px;}
  .backbtn{
    appearance:none; border:1px solid var(--line); background:var(--ink-2); color:var(--paper);
    width:36px;height:36px;border-radius:10px; display:flex;align-items:center;justify-content:center;
    font-size:18px; cursor:pointer; flex:none;
  }
  .detail-titles{min-width:0;}
  .detail-titles .num{font-family:'PT Mono',monospace; font-size:11px; color:var(--amber); letter-spacing:.1em;}
  .detail-titles h2{font-family:'PT Serif',serif; font-size:18px; margin:2px 0 0; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:12px; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:none; font-family:'PT Sans',sans-serif; font-size:13px; font-weight:700;
    padding:8px 13px; border-radius:999px; border:1px solid var(--line); background:transparent;
    color:var(--mist); cursor:pointer; white-space:nowrap;
  }
  .tab.active{ background:var(--amber); color:#241505; border-color:var(--amber);}

  .list{padding:14px 16px 40px; display:flex; flex-direction:column; gap:10px;}
  .ticket{
    background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 14px; display:flex; align-items:center; gap:12px; cursor:pointer;
    transition:border-color .15s ease;
  }
  .ticket:active{border-color:var(--amber);}
  .ticket .idx{
    font-family:'PT Mono',monospace; font-size:12px; color:var(--ink);
    background:var(--paper); width:34px;height:34px;border-radius:9px;
    display:flex;align-items:center;justify-content:center; flex:none; font-weight:700;
  }
  .ticket.done .idx{background:var(--teal); color:#fff;}
  .ticket-body{min-width:0; flex:1;}
  .ticket-body h3{margin:0 0 3px; font-family:'PT Serif',serif; font-size:15.5px; color:#fff; line-height:1.25;}
  .ticket-body .topic{margin:0; font-size:12px; color:var(--mist);}
  .status{
    font-family:'PT Mono',monospace; font-size:10px; letter-spacing:.06em; text-transform:uppercase;
    padding:4px 8px; border-radius:6px; flex:none;
    background:rgba(255,255,255,.06); color:var(--mist); border:1px solid var(--line);
  }
  .status.done{ color:var(--teal); border-color:rgba(47,143,130,.4); background:rgba(47,143,130,.12);}
  .progress-track{height:3px; background:var(--line); border-radius:3px; margin-top:16px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--amber); width:0%; transition:width .3s ease;}
  .progress-label{font-family:'PT Mono',monospace; font-size:11px; color:var(--mist); margin-top:8px; text-align:right;}

  .pane{padding:18px 18px 60px; background:var(--paper); color:var(--charcoal); min-height:60vh; display:none;}
  .pane.active{display:block;}
  .card{
    background:var(--paper-2); border-radius:var(--radius); padding:16px 16px;
    margin-bottom:12px; border:1px solid var(--line-dark);
  }
  .rule-num{
    font-family:'PT Mono',monospace; font-size:11px; color:var(--amber-deep); letter-spacing:.08em;
  }
  .card h4{margin:2px 0 6px; font-family:'PT Serif',serif; font-size:16px;}
  .card p{margin:0 0 6px; font-size:14px; line-height:1.55;}
  .card .ex{
    font-family:'PT Mono',monospace; font-size:13px; background:var(--paper); padding:8px 10px;
    border-radius:8px; margin-top:6px; color:#3a4351; border-left:3px solid var(--amber);
  }

  .exq{margin-bottom:16px;}
  .exq .qn{font-family:'PT Mono',monospace; font-size:11px; color:var(--amber-deep);}
  .exq p.qtext{font-size:14.5px; margin:4px 0 8px; line-height:1.5;}
  .exq input[type=text]{
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid #C9CDD5;
    font-family:'PT Sans',sans-serif; font-size:14px; background:#fff;
  }
  .exq .opts{display:flex; flex-wrap:wrap; gap:8px; margin-top:2px;}
  .opt-btn{
    border:1px solid #C9CDD5; background:#fff; padding:8px 12px; border-radius:8px;
    font-size:13.5px; cursor:pointer; font-family:'PT Sans',sans-serif;
  }
  .opt-btn.picked{border-color:var(--amber-deep); background:#FBEEDA;}
  .checkbtn{
    margin-top:8px; background:var(--ink); color:#fff; border:none; padding:8px 14px;
    border-radius:8px; font-size:13px; cursor:pointer; font-family:'PT Sans',sans-serif; font-weight:700;
  }
  .fb{margin-top:8px; font-size:13px; padding:8px 10px; border-radius:8px; display:none;}
  .fb.ok{display:block; background:#E4F3EF; color:#1E6E5F;}
  .fb.bad{display:block; background:#FBE9E7; color:#A13E2E;}

  .dlg-title{font-family:'PT Serif',serif; font-size:16px; margin:0 0 12px;}
  .bubble-row{display:flex; margin-bottom:10px;}
  .bubble-row.left{justify-content:flex-start;}
  .bubble-row.right{justify-content:flex-end;}
  .bubble{
    max-width:82%; padding:10px 13px; border-radius:14px; background:#fff; border:1px solid var(--line-dark);
  }
  .bubble-row.right .bubble{background:var(--ink); color:#fff; border-color:var(--ink);}
  .bubble .who{font-family:'PT Mono',monospace; font-size:10.5px; color:var(--amber-deep); margin-bottom:3px; letter-spacing:.05em;}
  .bubble-row.right .bubble .who{color:var(--amber);}
  .bubble .ru{font-size:14.5px; line-height:1.4;}
  .bubble .tr{font-size:11.5px; color:#B9803A; margin-top:3px; font-family:'PT Mono',monospace;}
  .bubble-row.right .bubble .tr{color:var(--amber);}
  .bubble .uz{font-size:12px; color:var(--mist); margin-top:4px; font-style:italic;}
  .bubble-row.right .bubble .uz{color:#B9C0C9;}

  .vocab-table{width:100%; border-collapse:collapse;}
  .vocab-table tr{border-bottom:1px solid var(--line-dark);}
  .vocab-table tr:last-child{border-bottom:none;}
  .vocab-table td{padding:10px 4px; font-size:14px; vertical-align:top;}
  .vocab-table td.ru{font-weight:700; width:46%;}
  .vocab-table td.tr{font-family:'PT Mono',monospace; font-size:11.5px; color:var(--amber-deep); display:block; margin-top:2px; font-weight:400;}
  .vocab-table td.uz{color:#454C57;}

  .alpha-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px;}
  .alpha-cell{
    background:var(--paper); border-radius:10px; padding:10px 6px; text-align:center;
    border:1px solid var(--line-dark);
  }
  .alpha-cell .letter{font-family:'PT Serif',serif; font-size:22px; font-weight:700;}
  .alpha-cell .sound{font-family:'PT Mono',monospace; font-size:10.5px; color:var(--amber-deep); margin-top:2px;}

  .section-label{
    font-family:'PT Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--amber-deep); margin:0 0 12px;
  }

  footer.hint{
    padding:14px 20px 30px; text-align:center; font-size:11.5px; color:var(--mist);
    font-family:'PT Mono',monospace;
  }
</style>
</head>
<body>
<div id="app">

  <div id="listView">
    <div class="brandbar">
      <p class="eyebrow">Gaplashamiz · v1</p>
      <h1>Rus tilini noldan o'rganamiz</h1>
      <p>Alifbodan boshlab — oson, bosqichma-bosqich, kundalik muloqot uchun</p>
      <div class="level-row" id="levelRow"></div>
      <div class="progress-track"><div class="progress-fill" id="overallFill"></div></div>
      <div class="progress-label" id="overallLabel">0 / 15 dars tugallandi</div>
    </div>
    <div class="list" id="lessonList"></div>
    <footer class="hint">Progress qurilmangizda saqlanadi · offline ishlaydi</footer>
  </div>

  <div id="detailView" style="display:none;">
    <div class="detail-header">
      <div class="detail-toprow">
        <button class="backbtn" id="backBtn">‹</button>
        <div class="detail-titles">
          <div class="num" id="dNum">DARS 1</div>
          <h2 id="dTitle">—</h2>
        </div>
      </div>
      <div class="tabs">
        <button class="tab" data-tab="rules">Qoidalar</button>
        <button class="tab" data-tab="exercises">Mashqlar</button>
        <button class="tab" data-tab="dialogue">Dialog</button>
        <button class="tab" data-tab="reading">Matn</button>
        <button class="tab" data-tab="vocab">Lug'at</button>
      </div>
    </div>

    <div class="pane" data-pane="rules">
      <p class="section-label">Qoidalar va tushuntirish</p>
      <div id="rulesBody"></div>
    </div>
    <div class="pane" data-pane="exercises">
      <p class="section-label">Amaliy mashqlar</p>
      <div id="exBody"></div>
    </div>
    <div class="pane" data-pane="dialogue">
      <p class="section-label">Kundalik dialog</p>
      <div class="card">
        <p class="dlg-title" id="dlgTitle"></p>
        <div id="dlgBody"></div>
      </div>
    </div>
    <div class="pane" data-pane="reading">
      <p class="section-label">Matn (o'qish uchun)</p>
      <div class="card">
        <p class="dlg-title" id="readTitle"></p>
        <div id="readBodyRu" style="font-size:14.5px; line-height:1.7; margin-bottom:12px;"></div>
        <div style="height:1px; background:var(--line-dark); margin:12px 0;"></div>
        <p class="rule-num">TARJIMA</p>
        <div id="readBodyUz" style="font-size:13.5px; line-height:1.65; color:#454C57; margin-top:6px;"></div>
      </div>
    </div>
    <div class="pane" data-pane="vocab">
      <p class="section-label">Lug'at</p>
      <div class="card"><table class="vocab-table" id="vocabBody"></table></div>
      <button class="checkbtn" id="markDoneBtn" style="width:100%; padding:12px; margin-top:6px;">Darsni tugallangan deb belgilash</button>
    </div>
  </div>

</div>

<script src="lessons.js"></script>
<script src="app.js"></script>
</body>
</html>
