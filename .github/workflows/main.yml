name: Build Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "ruscha-gaplashamiz",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo Web app ready"
            },
            "dependencies": {
              "@capacitor/core": "7.4.3",
              "@capacitor/android": "7.4.3",
              "@capacitor/cli": "7.4.3"
            }
          }
          EOF

      - name: Install Capacitor
        run: npm install

      - name: Create web directory
        run: |
          mkdir -p www
          cp index.html www/
          cp app.js www/
          cp lessons.js www/
          cp manifest.json www/
          cp sw.js www/
          cp icon-192.png www/
          cp icon-512.png www/

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.ruscha.gaplashamiz',
            appName: 'Ruscha-gaplashamiz',
            webDir: 'www',
            bundledWebRuntime: false
          };

          export default config;
          EOF

      - name: Add Android
        run: npx cap add android

      - name: Copy web files
        run: npx cap copy android

      - name: Update Android configuration
        run: |
          sed -i 's/minSdk = [0-9]*/minSdk = 23/' android/variables.gradle || true
          sed -i 's/targetSdk = [0-9]*/targetSdk = 35/' android/variables.gradle || true
          sed -i 's/compileSdk = [0-9]*/compileSdk = 35/' android/variables.gradle || true

      - name: Build unsigned release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Create signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore release.keystore \
            -alias ruscha-gaplashamiz \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Ruscha Gaplashamiz, OU=App, O=OMAD89, L=Termiz, ST=Surxondaryo, C=UZ"

      - name: Sign APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"

          $ANDROID_HOME/build-tools/35.0.0/zipalign \
            -f 4 \
            "$APK" \
            aligned.apk

          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out Ruscha-gaplashamiz.apk \
            aligned.apk

      - name: Verify APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose Ruscha-gaplashamiz.apk
          ls -lh Ruscha-gaplashamiz.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ruscha-gaplashamiz-APK
          path: Ruscha-gaplashamiz.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ruscha-gaplashamiz v1.0.${{ github.run_number }}
          body: |
            Ruscha-gaplashamiz
            Signed Android APK
            Version 1.0.${{ github.run_number }}
          files: Ruscha-gaplashamiz.apk
